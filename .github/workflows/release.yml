name: Release on tag (macOS and Windows binaries)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  precheck:
    name: Validate tag and run tests
    runs-on: macos-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # need full history to verify ancestry

      - name: Validate tag format (vMAJOR.MINOR.PATCH) and Cargo version
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Tag must match vMAJOR.MINOR.PATCH (e.g., v0.1.0). Given: $TAG"
            exit 1
          fi
          VERSION=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\(.*\)"/\1/p' Cargo.toml)
          if [ "v$VERSION" != "$TAG" ]; then
            echo "Tag $TAG does not match workspace version $VERSION in Cargo.toml"
            exit 1
          fi

      - name: Ensure tag is on master branch history
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF#refs/tags/}"
          COMMIT_SHA=$(git rev-list -n 1 "$TAG")
          git fetch --quiet origin master
          if git merge-base --is-ancestor "$COMMIT_SHA" origin/master; then
            echo "Tag $TAG is contained in master's history. Proceeding."
          else
            echo "Tag $TAG is NOT on master branch history. Failing to prevent release."
            exit 1
          fi

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Run tests
        run: cargo test --workspace --release --locked

  build:
    name: Build binaries (${{ matrix.target }})
    runs-on: ${{ matrix.os }}
    needs: precheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: macos_arm64
            os: macos-latest
          - target: x86_64-apple-darwin
            name: macos_amd64
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            name: windows_amd64
            os: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      # openh264 uses nasm for its x86 assembly (falls back to plain C without it)
      - name: Install nasm
        if: matrix.target == 'x86_64-apple-darwin'
        run: brew install nasm

      - name: Build
        run: cargo build --release --locked --target ${{ matrix.target }} -p psconnector-view -p psconnector-mcp

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          BASE="psconnector_${{ github.ref_name }}_${{ matrix.name }}"
          EXT=""
          if [ "${{ runner.os }}" = "Windows" ]; then EXT=".exe"; fi
          mkdir -p "$BASE/python" artifacts
          cp "target/${{ matrix.target }}/release/psconnector-view${EXT}" "$BASE/"
          cp "target/${{ matrix.target }}/release/psconnector-mcp${EXT}" "$BASE/"
          cp README.md LICENSE "$BASE/"
          cp -R macros "$BASE/"
          cp python/*.py "$BASE/python/"
          if [ "${{ runner.os }}" = "Windows" ]; then
            7z a -tzip "artifacts/${BASE}.zip" "$BASE"
          else
            tar -czf "artifacts/${BASE}.tar.gz" "$BASE"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: artifacts/*

  release:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Flatten and checksum
        shell: bash
        run: |
          set -e
          cd artifacts
          find . -mindepth 2 -type f -print0 | xargs -0 -I {} mv {} .
          find . -mindepth 1 -type d -empty -delete
          sha256sum * > checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

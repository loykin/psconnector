[package]
name = "psconnector-view"
description = "PS5 screen window + command port + macro runner on top of psconnector"
version.workspace = true
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
psconnector.workspace = true
psconnector-protocol.workspace = true
anyhow.workspace = true
bytemuck = { version = "1", features = ["derive"] }
chrono = { version = "0.4.45", default-features = false, features = ["clock"] }
cpal = "0.18.2"
eframe = "0.37.0"
gilrs = "0.11.2"
# DualSense touchpad fingers (gilrs only reports the click)
hidapi = { version = "2.6.7", features = ["macos-shared-device"] }
log.workspace = true
env_logger.workspace = true
png.workspace = true
rayon = "1.11"
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
# component gallery snapshots (design/screens/gallery-*.png)
egui_kittest = { version = "0.37.0", features = ["wgpu", "snapshot"] }

[build-dependencies]
# design/tokens.json -> theme constants
serde_json.workspace = true

# the .exe file icon (assets/icon.ico), embedded when building on Windows
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

# in-app PSN sign-in window (system web view)
[target.'cfg(any(target_os = "macos", target_os = "windows"))'.dependencies]
tao = "0.37.2"
wry = "0.57.1"

[target.'cfg(target_os = "macos")'.dependencies]
# Edit menu for the sign-in window: on macOS, copy/paste shortcuts only work through the app menu
muda = "0.21.2"
block2 = "0.6.2"
objc2 = "0.6.5"
objc2-foundation = "0.3.2"
objc2-vision = "0.3.2"
# zero-copy video: decoder pixel buffers as Metal textures
cidre = "0.16"
objc2-metal = "0.3.2"
